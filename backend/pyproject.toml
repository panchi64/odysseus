[project]
name = "odysseus-backend"
version = "0.1.0"
description = "Odysseus backend — the chassis around a Pydantic AI engine."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic-ai>=0.2",
    "sqlmodel>=0.0.22",
    "cryptography>=44",
    "argon2-cffi>=23",
    "alembic>=1.18.4",
    "numpy>=2.4.6",
    "openai>=2.41.0",
    "websockets>=16.0",
    "httpx>=0.28",
    # Cross-platform CPU/RAM facts for the Cookbook hardware probe (GPU/VRAM stay on
    # subprocess probes). Portable wheels for all target POSIX hosts.
    "psutil>=6",
    # Web fetch: pages are rendered in a headless Chromium that runs in a container and is
    # driven over CDP (services/webfetch) — so Playwright is the client only, with NO local
    # browser binary to install. trafilatura is the top-scoring open-source main-content
    # extractor — run here over the rendered HTML string (not as a fetcher), emitting
    # Markdown natively (output_format="markdown"). Pulls lxml transitively.
    "playwright>=1.49",
    "trafilatura>=2.0",
    "langdetect>=1.0.9",
    "pypdfium2>=5.10.1",
    "pillow>=12.2.0",
    # Local model serving (services/serving): download HuggingFace models with progress.
    # Already resolved transitively (via pydantic-ai's hf extra); pinned direct since the
    # serving download manager calls snapshot_download / hf_hub_download / HfApi directly.
    # The inference engines themselves are NOT Python deps — llama.cpp is a fetched/detected
    # binary and mlx-openai-server installs into an adapter-owned isolated env.
    "huggingface-hub>=1.18",
    "croniter>=6.2.4",
    # Agent Skills bundles (services/skills): SKILL.md frontmatter is YAML, and the format is
    # an interop contract with Claude Code / the Skills API, so it is parsed and re-rendered
    # rather than approximated. Already resolved transitively (huggingface-hub, uvicorn's
    # extras); pinned direct since the bundle parser calls yaml.safe_load/safe_dump itself.
    "pyyaml>=6",
]

# Whole-DB SQLCipher was ruled out (no portable 3.14 wheels); at-rest
# encryption is application-layer AEAD instead (see docs decision D17).
# Alembic migrations are wired (auto-upgrade on startup); sqlite-vec lands later.

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
# Autogenerated Alembic revisions — long create_index lines, boilerplate imports.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
