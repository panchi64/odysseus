[project]
name = "odysseus-backend"
version = "0.1.0"
description = "Odysseus backend — the chassis around a Pydantic AI engine."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic-ai>=2.31",
    # The Pydantic team's own capability library: the sandbox file tools (`FileSystem`)
    # and the agent's task list (`Planning`) are theirs to maintain, not ours.
    "pydantic-ai-harness>=0.22",
    # Filesystem/network confinement for the approved host-command escape hatch —
    # seatbelt on macOS, bubblewrap on Linux, no container.
    "sandbox-runtime>=0.2",
    "sqlmodel>=0.0.22",
    "cryptography>=44",
    "argon2-cffi>=23",
    "alembic>=1.18.4",
    # Imported directly by our own modules rather than relied on transitively.
    "sqlalchemy>=2.0",
    "starlette>=1.3",
    "lxml>=5",
    "anyio>=4",
    "numpy>=2.4.6",
    "openai>=2.41.0",
    "websockets>=16.0",
    "httpx>=0.28",
    # Web fetch: pages are rendered in a headless Chromium that runs in a container and is
    # driven over CDP (services/webfetch) — so Playwright is the client only, with NO local
    # browser binary to install. trafilatura is the top-scoring open-source main-content
    # extractor — run here over the rendered HTML string (not as a fetcher), emitting
    # Markdown natively (output_format="markdown"). Pulls lxml transitively.
    "playwright>=1.49",
    "trafilatura>=2.2",
    "langdetect>=1.0.9",
    "pypdfium2>=5.10.1",
    "pillow>=12.2.0",
    "croniter>=6.2.4",
    # Agent Skills bundles (services/skills): SKILL.md frontmatter is YAML, and the format is
    # an interop contract with Claude Code / the Skills API, so it is parsed and re-rendered
    # rather than approximated. Already resolved transitively (uvicorn's extras); pinned
    # direct since the bundle parser calls yaml.safe_load/safe_dump itself.
    "pyyaml>=6",
    # Mail (services/mail): IMAP reading with IDLE (so new mail arrives as a push rather
    # than a poll) and SMTP submission. Both are pure-Python and async-native. The Gmail,
    # Graph and JMAP transports need no client library of their own — they are REST/JSON
    # over the httpx client this app already carries.
    "aioimaplib>=2.0",
    "aiosmtplib>=4.0",
    # OAuth2 (auth-code + PKCE + refresh) for the Gmail/Graph mail transports. Chosen over
    # google-api-python-client/msal: those are sync, heavy, and keep their own on-disk
    # credential caches, which fights the memory-only-key posture — refresh tokens here are
    # vault-sealed like every other secret.
    "authlib>=1.6",
    # Splitting a reply from the quoted thread beneath it (EMAIL-4).
    "email-reply-parser>=0.5.12",
    # Calendar (services/calendar): RFC 5545 parsing/emitting for ICS import/export, the
    # maintained CalDAV client for remote sync (sync API — call it via anyio.to_thread), and
    # dateutil's rrule for recurrence expansion. Time zones come from stdlib zoneinfo, not
    # pytz. dateutil is already resolved transitively; pinned direct since we call it.
    "icalendar>=6.1",
    "caldav>=1.4",
    "python-dateutil>=2.9",
    # The Auto permission level's deterministic stage (services/permissions/shell_ast.py)
    # reads a shell command's worst case off its syntax before deciding whether it needs a
    # model's opinion, and the cases that matter are exactly the ones a regex gets wrong —
    # a `;` inside a quoted string, a `$(…)` inside a `"…"`. tree-sitter-bash is the real
    # grammar, maintained, and it recovers from errors instead of raising, so a command it
    # cannot parse comes back as a tree with error nodes we can see and refuse to vouch
    # for. Chosen over bashlex, which is pure-Python but unmaintained since ~2019 and
    # brittle on ordinary bashisms.
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

# Whole-DB SQLCipher was ruled out (no portable 3.14 wheels); at-rest
# encryption is application-layer AEAD instead (see docs decision D17).
# Alembic migrations are wired (auto-upgrade on startup); sqlite-vec lands later.

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
# Autogenerated Alembic revisions — long create_index lines, boilerplate imports.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# `-n auto` fans the suite across every core: it is ~2200 mostly-independent tests, each
# on its own throwaway database and temp directory, so there is nothing to serialize on.
# `-n0` puts it back in one process when a run needs `--pdb` or live output.
# `not container` holds back the tests that pull and boot a real container image. They
# reach the network on every run (`ensure_image` re-pulls `:latest`), which costs a
# minute or more and makes the suite's duration depend on registry reachability, so they
# are opt-in — `-m container` runs exactly those, and CI should run both selections.
addopts = "-n auto -m 'not container'"
markers = [
    "container: needs a container runtime and pulls an image; excluded from the default run",
]
